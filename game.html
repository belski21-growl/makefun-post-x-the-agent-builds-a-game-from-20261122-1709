<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>METEOR RUSH — a neon arcade dodger</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050514; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 14px; text-align: center;
    color: rgba(255,255,255,.55); font-size: 13px; letter-spacing: .08em;
    pointer-events: none; text-transform: uppercase;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hint">Arrows / WASD / drag &nbsp;·&nbsp; collect stars &nbsp;·&nbsp; dodge meteors</div>
<script>
"use strict";
/* METEOR RUSH — a neon arcade dodger.
   One prompt, one file: pilot a little rocket, dodge falling meteors,
   collect stars, 3 lives, speed ramps up as the score climbs.
   Controls: Arrow keys / WASD, or touch-drag / mouse-drag. R restarts. */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* ---------- WebAudio synth SFX (no audio files) ---------- */
let audioCtx = null;
function audio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, type, vol, slideTo) {
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime;
  const osc = ac.createOscillator();
  const g = ac.createGain();
  osc.type = type || "sine";
  osc.frequency.setValueAtTime(freq, t);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol || 0.15, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(ac.destination);
  osc.start(t); osc.stop(t + dur + 0.02);
}
function noiseBurst(dur, vol) {
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime;
  const len = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = ac.createBufferSource(); src.buffer = buf;
  const g = ac.createGain(); g.gain.setValueAtTime(vol || 0.25, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900;
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start(t);
}
const sfx = {
  collect() { tone(880, 0.09, "sine", 0.18); setTimeout(() => tone(1318, 0.12, "sine", 0.15), 60); },
  hit()     { noiseBurst(0.25, 0.3); tone(160, 0.3, "sawtooth", 0.2, 40); },
  over()    { [392, 311, 262, 196].forEach((f, i) => setTimeout(() => tone(f, 0.22, "triangle", 0.2), i * 160)); },
  start()   { [262, 392, 523, 784].forEach((f, i) => setTimeout(() => tone(f, 0.12, "square", 0.1), i * 80)); },
  level()   { tone(523, 0.1, "square", 0.1); setTimeout(() => tone(784, 0.14, "square", 0.1), 90); },
};

/* ---------- Game state ---------- */
const STATE = { MENU: 0, PLAYING: 1, OVER: 2 };
let state = STATE.MENU;
let score = 0, lives = 3, level = 1, best = 0;
let elapsed = 0, spawnTimer = 0, starTimer = 0, shake = 0;
let invuln = 0; // seconds of post-hit invulnerability
let meteors = [], stars = [], particles = [], bgStars = [];
let flash = 0; // red flash on hit (0..1)

const rocket = {
  x: 0, y: 0, vx: 0, vy: 0,
  r: 16, angle: -Math.PI / 2, flame: 0,
};
function resetRocket() {
  rocket.x = W / 2; rocket.y = H * 0.72;
  rocket.vx = 0; rocket.vy = 0;
}

/* Background starfield (3 depth layers, slow drift). */
function initBg() {
  bgStars = [];
  const n = Math.floor(W * H / 9000);
  for (let i = 0; i < n; i++) {
    bgStars.push({
      x: Math.random() * W, y: Math.random() * H,
      z: 0.3 + Math.random() * 0.7, r: 0.6 + Math.random() * 1.6,
      tw: Math.random() * Math.PI * 2,
    });
  }
}
initBg();

/* ---------- Input: keyboard + pointer drag ---------- */
const keys = {};
const PROMPT_KEYS = ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "];
window.addEventListener("keydown", (e) => {
  if (PROMPT_KEYS.includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if (e.key === "r" || e.key === "R") { if (state === STATE.OVER) startGame(); }
  if (state === STATE.MENU && (e.key === "Enter" || e.key === " ")) startGame();
  else if (state === STATE.OVER && (e.key === "Enter" || e.key === " ")) startGame();
  audio(); // unlock audio on first key
});
window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

let dragging = false, dragX = 0, dragY = 0;
canvas.addEventListener("pointerdown", (e) => {
  dragging = true; dragX = e.clientX; dragY = e.clientY;
  audio();
  if (state === STATE.MENU) startGame();
});
canvas.addEventListener("pointermove", (e) => {
  if (dragging) { dragX = e.clientX; dragY = e.clientY; }
});
window.addEventListener("pointerup", () => { dragging = false; });

/* ---------- Spawning ---------- */
function spawnMeteor() {
  const r = 14 + Math.random() * 26;
  const speed = (90 + level * 32) * (0.8 + Math.random() * 0.5);
  meteors.push({
    x: r + Math.random() * (W - 2 * r),
    y: -r - 10,
    r: r,
    vy: speed,
    vx: (Math.random() - 0.5) * 60,
    rot: Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 2.2,
    verts: makeRockVerts(r),
    hue: Math.random() < 0.5 ? "#ff7a45" : "#b8b8d0",
  });
}
function makeRockVerts(r) {
  const v = [], n = 9;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const rr = r * (0.72 + Math.random() * 0.45);
    v.push([Math.cos(a) * rr, Math.sin(a) * rr]);
  }
  return v;
}
function spawnStar() {
  stars.push({
    x: 24 + Math.random() * (W - 48),
    y: -20,
    r: 13,
    vy: 110 + level * 12,
    rot: Math.random() * Math.PI,
    vr: (Math.random() - 0.5) * 3,
    pulse: Math.random() * Math.PI * 2,
  });
}
function burst(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = speed * (0.3 + Math.random() * 0.7);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.5 + Math.random() * 0.4, max: 0.9, r: 1.5 + Math.random() * 2.5, color });
  }
}

/* ---------- Flow ---------- */
function startGame() {
  score = 0; lives = 3; level = 1;
  elapsed = 0; spawnTimer = 0; starTimer = 0.4;
  meteors = []; stars = []; particles = [];
  invuln = 0; flash = 0;
  resetRocket();
  state = STATE.PLAYING;
  sfx.start();
  document.getElementById("hint").style.display = "none";
}
function gameOver() {
  state = STATE.OVER;
  best = Math.max(best, score);
  burst(rocket.x, rocket.y, "#ff5a5a", 40, 260);
  burst(rocket.x, rocket.y, "#ffd23e", 24, 200);
  sfx.over();
  document.getElementById("hint").style.display = "";
}
function levelFor(score) { return 1 + Math.floor(score / 150); }

/* ---------- Update ---------- */
function update(dt) {
  elapsed += dt;
  // background drift
  for (const s of bgStars) {
    s.y += 14 * s.z * dt;
    s.tw += dt * 2;
    if (s.y > H + 4) { s.y = -4; s.x = Math.random() * W; }
  }
  if (state !== STATE.PLAYING) {
    for (const p of particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    particles = particles.filter(p => p.life > 0);
    if (shake > 0) shake = Math.max(0, shake - dt * 30);
    if (flash > 0) flash = Math.max(0, flash - dt * 2);
    return;
  }

  // --- rocket movement ---
  const ACC = 2600, MAXV = 560;
  let ax = 0, ay = 0;
  if (keys["arrowleft"] || keys["a"]) ax -= 1;
  if (keys["arrowright"] || keys["d"]) ax += 1;
  if (keys["arrowup"] || keys["w"]) ay -= 1;
  if (keys["arrowdown"] || keys["s"]) ay += 1;
  if (ax || ay) {
    const len = Math.hypot(ax, ay);
    rocket.vx += (ax / len) * ACC * dt;
    rocket.vy += (ay / len) * ACC * dt;
    rocket.flame = 1;
  } else {
    rocket.flame = Math.max(0, rocket.flame - dt * 4);
  }
  if (dragging) {
    // ease toward the pointer: direct, responsive drag
    const k = 1 - Math.pow(0.0001, dt);
    rocket.vx = (dragX - rocket.x) * 14 * k + rocket.vx * (1 - k) * 0.2;
    rocket.vy = (dragY - rocket.y) * 14 * k + rocket.vy * (1 - k) * 0.2;
    rocket.x += (dragX - rocket.x) * Math.min(1, dt * 18);
    rocket.y += (dragY - rocket.y) * Math.min(1, dt * 18);
    rocket.flame = 1;
  }
  const sp = Math.hypot(rocket.vx, rocket.vy);
  if (sp > MAXV) { rocket.vx *= MAXV / sp; rocket.vy *= MAXV / sp; }
  rocket.vx *= Math.pow(0.12, dt); // drag / damping
  rocket.vy *= Math.pow(0.12, dt);
  if (!dragging) { rocket.x += rocket.vx * dt; rocket.y += rocket.vy * dt; }
  rocket.x = Math.max(rocket.r, Math.min(W - rocket.r, rocket.x));
  rocket.y = Math.max(rocket.r, Math.min(H - rocket.r, rocket.y));
  rocket.angle = -Math.PI / 2 + Math.max(-0.5, Math.min(0.5, rocket.vx * 0.0009));

  // --- difficulty ramp ---
  const newLevel = levelFor(score);
  if (newLevel > level) { level = newLevel; sfx.level(); }

  // --- spawning ---
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnMeteor();
    if (Math.random() < 0.35) spawnMeteor();
    spawnTimer = Math.max(0.16, 0.62 - level * 0.045) * (0.7 + Math.random() * 0.6);
  }
  starTimer -= dt;
  if (starTimer <= 0) { spawnStar(); starTimer = 0.9 + Math.random() * 0.9; }

  // --- meteors ---
  for (const m of meteors) {
    m.y += m.vy * dt; m.x += m.vx * dt; m.rot += m.vr * dt;
    if (m.x < m.r) { m.x = m.r; m.vx = Math.abs(m.vx); }
    if (m.x > W - m.r) { m.x = W - m.r; m.vx = -Math.abs(m.vx); }
  }
  meteors = meteors.filter(m => m.y < H + m.r + 20);

  // --- stars ---
  for (const s of stars) {
    s.y += s.vy * dt; s.rot += s.vr * dt; s.pulse += dt * 5;
  }
  stars = stars.filter(s => s.y < H + 30);

  // --- particles ---
  for (const p of particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98; p.vy *= 0.98; }
  particles = particles.filter(p => p.life > 0);

  if (invuln > 0) invuln -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 30);
  if (flash > 0) flash = Math.max(0, flash - dt * 2);

  // --- collisions ---
  const ROCKET_HIT = rocket.r * 0.72;
  for (const m of meteors) {
    const dx = m.x - rocket.x, dy = m.y - rocket.y;
    const rr = m.r * 0.82 + ROCKET_HIT;
    if (dx * dx + dy * dy < rr * rr) {
      if (invuln <= 0) {
        lives -= 1; invuln = 2; flash = 1; shake = 14;
        burst(rocket.x, rocket.y, "#ff6b4a", 26, 240);
        sfx.hit();
        m.y = H + 999; // remove the meteor that hit
        if (lives <= 0) { gameOver(); return; }
      }
      break;
    }
  }
  for (const s of stars) {
    const dx = s.x - rocket.x, dy = s.y - rocket.y;
    if (dx * dx + dy * dy < (s.r + ROCKET_HIT + 8) * (s.r + ROCKET_HIT + 8)) {
      score += 10;
      burst(s.x, s.y, "#ffd23e", 12, 140);
      sfx.collect();
      s.y = H + 999;
    }
  }
  stars = stars.filter(s => s.y < H + 30);
  // survival trickle: staying alive pays a little
  score += dt * 2;
}

/* ---------- Drawing ---------- */
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#0a0626");
  g.addColorStop(0.55, "#0b1038");
  g.addColorStop(1, "#160b33");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // nebula blobs
  ctx.globalAlpha = 0.16;
  nebula(W * 0.2, H * 0.25, W * 0.42, "#c41c83");
  nebula(W * 0.85, H * 0.6, W * 0.5, "#1e6fff");
  nebula(W * 0.5, H * 0.9, W * 0.45, "#7b2fff");
  ctx.globalAlpha = 1;
  for (const s of bgStars) {
    ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(s.tw));
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * s.z, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function nebula(x, y, r, color) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color);
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}

function drawRocket() {
  if (state === STATE.OVER) return;
  const blink = invuln > 0 && Math.floor(elapsed * 12) % 2 === 0;
  ctx.save();
  ctx.translate(rocket.x, rocket.y);
  ctx.rotate(rocket.angle + Math.PI / 2);
  if (blink) ctx.globalAlpha = 0.35;
  // flame
  const fl = 16 + rocket.flame * 22 + Math.random() * 6;
  const fg = ctx.createLinearGradient(0, 12, 0, 12 + fl);
  fg.addColorStop(0, "#ffe259");
  fg.addColorStop(0.5, "#ff7a18");
  fg.addColorStop(1, "rgba(255,60,60,0)");
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(-7, 12); ctx.lineTo(0, 12 + fl); ctx.lineTo(7, 12);
  ctx.closePath(); ctx.fill();
  // body
  ctx.shadowColor = "#00e5ff"; ctx.shadowBlur = 18;
  const bg = ctx.createLinearGradient(0, -22, 0, 16);
  bg.addColorStop(0, "#e8fbff"); bg.addColorStop(0.45, "#7ee7ff"); bg.addColorStop(1, "#1e9fd8");
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(0, -24);
  ctx.quadraticCurveTo(12, -8, 11, 8);
  ctx.lineTo(11, 14); ctx.lineTo(-11, 14); ctx.lineTo(-11, 8);
  ctx.quadraticCurveTo(-12, -8, 0, -24);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  // window
  ctx.fillStyle = "#0b1038";
  ctx.beginPath(); ctx.arc(0, -4, 5.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#bfefff";
  ctx.beginPath(); ctx.arc(-1.5, -5.5, 2.4, 0, Math.PI * 2); ctx.fill();
  // fins
  ctx.fillStyle = "#ff2e88";
  ctx.beginPath(); ctx.moveTo(-11, 6); ctx.lineTo(-20, 18); ctx.lineTo(-11, 16); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(11, 6); ctx.lineTo(20, 18); ctx.lineTo(11, 16); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawMeteor(m) {
  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.rotate(m.rot);
  ctx.shadowColor = m.hue; ctx.shadowBlur = 12;
  ctx.fillStyle = "#3d3348";
  ctx.beginPath();
  ctx.moveTo(m.verts[0][0], m.verts[0][1]);
  for (let i = 1; i < m.verts.length; i++) ctx.lineTo(m.verts[i][0], m.verts[i][1]);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = m.hue; ctx.lineWidth = 2; ctx.globalAlpha = 0.9;
  ctx.stroke();
  ctx.globalAlpha = 1;
  // craters
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath(); ctx.arc(-m.r * 0.25, -m.r * 0.1, m.r * 0.22, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(m.r * 0.3, m.r * 0.3, m.r * 0.16, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawStar(s) {
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.rot);
  const pulse = 1 + Math.sin(s.pulse) * 0.12;
  ctx.scale(pulse, pulse);
  ctx.shadowColor = "#ffd23e"; ctx.shadowBlur = 16;
  ctx.fillStyle = "#ffd23e";
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
    const rr = i % 2 === 0 ? s.r : s.r * 0.45;
    const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#fff7cc";
  ctx.beginPath(); ctx.arc(0, 0, s.r * 0.32, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  const pad = 18;
  ctx.textBaseline = "top";
  // score
  ctx.fillStyle = "#ffffff";
  ctx.font = "800 " + Math.round(Math.min(W * 0.085, 44)) + "px 'Segoe UI', system-ui, sans-serif";
  ctx.textAlign = "left";
  ctx.shadowColor = "#00e5ff"; ctx.shadowBlur = 12;
  ctx.fillText("SCORE " + Math.floor(score), pad, pad + 8);
  ctx.shadowBlur = 0;
  // level
  ctx.font = "700 " + Math.round(Math.min(W * 0.045, 24)) + "px 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = "#7ee7ff";
  ctx.fillText("SPEED ×" + level, pad, pad + 8 + Math.min(W * 0.085, 44) + 8);
  // lives as hearts
  ctx.textAlign = "right";
  ctx.font = Math.round(Math.min(W * 0.075, 38)) + "px 'Segoe UI', system-ui, sans-serif";
  let hearts = "";
  for (let i = 0; i < 3; i++) hearts += i < lives ? "❤️" : "🖤";
  ctx.fillText(hearts, W - pad, pad + 8);
  ctx.textAlign = "left";
}

function drawCenterText(title, sub, accent) {
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.shadowColor = accent; ctx.shadowBlur = 24;
  ctx.fillStyle = "#ffffff";
  ctx.font = "900 " + Math.round(Math.min(W * 0.11, 64)) + "px 'Segoe UI', system-ui, sans-serif";
  ctx.fillText(title, W / 2, H * 0.32);
  ctx.shadowBlur = 0;
  ctx.font = "600 " + Math.round(Math.min(W * 0.045, 24)) + "px 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = "#cfe9ff";
  const lines = sub.split("\n");
  lines.forEach((ln, i) => ctx.fillText(ln, W / 2, H * 0.32 + 64 + i * 34));
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
}

function drawMenu() {
  drawCenterText("METEOR RUSH",
    "Dodge the meteors. Grab the stars.\n3 lives — speed ramps up as you score.\n\n▶ TAP OR PRESS SPACE TO LAUNCH", "#ff2e88");
  // demo rocket hovering
  rocket.x = W / 2; rocket.y = H * 0.58 + Math.sin(elapsed * 2) * 10;
  rocket.flame = 0.7;
  drawRocket();
}

function drawGameOver() {
  ctx.fillStyle = "rgba(5,5,20,0.55)";
  ctx.fillRect(0, 0, W, H);
  drawCenterText("GAME OVER",
    "SCORE  " + Math.floor(score) + "\nBEST  " + Math.floor(best) +
    "\n\n↻ TAP OR PRESS R TO FLY AGAIN", "#ff2e4d");
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBackground();
  for (const s of stars) drawStar(s);
  for (const m of meteors) drawMeteor(m);
  drawParticles();
  if (state !== STATE.MENU) drawRocket();
  if (state === STATE.MENU) drawMenu();
  if (state === STATE.PLAYING || state === STATE.OVER) drawHUD();
  if (state === STATE.OVER) drawGameOver();
  if (flash > 0) {
    ctx.fillStyle = "rgba(255,40,60," + (flash * 0.28) + ")";
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

/* ---------- Main loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- Demo autopilot (for the video capture only) ----------
   ?demo=1 makes the rocket steer itself: chase the nearest star,
   dodge the nearest meteor. Same game, same physics — scripted input. */
const params = new URLSearchParams(location.search);
if (params.get("demo") === "1") {
  setTimeout(() => { if (state === STATE.MENU) startGame(); }, 400);
  setInterval(() => {
    if (state === STATE.OVER) { startGame(); return; } // auto-restart for capture
    if (state !== STATE.PLAYING) return;
    let tx = rocket.x, ty = rocket.y - 40;
    let danger = null, dangerD = 1e9;
    for (const m of meteors) {
      if (m.y < rocket.y && m.y > rocket.y - 420) {
        const d = Math.abs(m.x - rocket.x) + (rocket.y - m.y) * 0.4;
        if (d < dangerD) { dangerD = d; danger = m; }
      }
    }
    if (danger && dangerD < 170) {
      tx = rocket.x + (rocket.x < danger.x ? -160 : 160);
      ty = rocket.y;
    } else {
      let bestStar = null, bestD = 1e9;
      for (const s of stars) {
        const d = Math.hypot(s.x - rocket.x, s.y - rocket.y);
        if (d < bestD) { bestD = d; bestStar = s; }
      }
      if (bestStar) { tx = bestStar.x; ty = bestStar.y; }
    }
    tx = Math.max(30, Math.min(W - 30, tx));
    ty = Math.max(60, Math.min(H - 60, ty));
    dragging = true; dragX = tx; dragY = ty;
  }, 90);
}

/* Tiny public handle for the capture harness (read-only state). */
window.__METEOR_RUSH__ = {
  get state() { return state; },
  get score() { return Math.floor(score); },
  get lives() { return lives; },
};
</script>
